# dsh-purge bundle patch
#
# 정리 + 모의 해킹 모두 이 플러그인 안에 있다(lib/redteam, presets/redteam, skills/redteam).
# dsh-purge 만 설치하고, 외부 연결이나 다른 레드팀 패키지 link 는 하지 않는다.

# 구버전 독립 레드팀 패키지 항목을 끈다(사용자가 이전에 dsh-redteam-mode 를 설치한 경우)
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # The runtime checks cwd availability; the config layer must not require it.
    personaSuffix: ""

- insert:
    - id: dsh-purge
      name: 'dsh-purge-community'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        excludePresets: []
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "계속"
        capabilityProtocol: true
        hooksDenyBypass: true

    # 모의 해킹: 프리셋 + 스킬 배치(이 플러그인 lib/redteam)
    - id: dsh-purge-redteam
      name: dsh-purge-community/redteam

    # 내장 agent 프리셋: unrestricted(무제한 모드)
    - id: dsh-purge-presets
      name: dsh-purge-community/presets-plugin

    # 모의 해킹 팩트 저장소(SQLite), 데이터는 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge-community/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 모의 해킹 HTTP 브리지 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge-community/redteam/ui
