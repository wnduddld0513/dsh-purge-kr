name: Community release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: community-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # 태그를 다시 밀거나 같은 버전으로 dispatch 하면 이미 있는 릴리스를 또 만들려다 실패한다.
  # 먼저 확인해서 이미 있으면 나머지 잡을 건너뛴다(건너뛴 실행은 실패가 아니라 성공으로 기록된다).
  preflight:
    if: github.repository == 'wnduddld0513/dsh-purge-kr'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.state.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Skip when this version is already released
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version 은 이미 릴리스되어 있습니다 — 설치 검증과 자산 생성을 건너뜁니다."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [preflight, installer]
    if: github.repository == 'wnduddld0513/dsh-purge-kr' && needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/purge-panel/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm --prefix packages/purge-panel ci --ignore-scripts --legacy-peer-deps
      - run: npm test && npm run check:client && npm run test:ui
      - run: npm run check:docs
      - run: npm pack --ignore-scripts && node scripts/smoke.mjs
      - run: npm --prefix packages/purge-panel test
      - name: Build verified release assets
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          notes="docs/releases/$version.md"
          test -f "$notes"
          test "$(head -n 1 "$notes")" = "# $version"
          test "$(grep -cE "^# [0-9]+\.[0-9]+\.[0-9]+" "$notes")" = 1
          test "$(wc -c < "$notes")" -le 8192
          test "$(node -p "require('./package.json').name")" = "dsh-purge-community"
          npm pack --ignore-scripts
          sha256sum "dsh-purge-community-$version.tgz" > SHA256SUMS.txt
      - name: Publish community release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # 발행 본문에는 이번 버전 구간만 넣는다. 과거 버전 기록은 release-notes.md 에 그대로 남는다.
          notes="docs/releases/$version.md"
          cp "$notes" release-body.md
          test -s release-body.md
          gh release create "$GITHUB_REF_NAME" "dsh-purge-community-$version.tgz" SHA256SUMS.txt --verify-tag --title "dsh-purge Community $version" --notes-file release-body.md

  installer:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --legacy-peer-deps
      # 이 워크플로는 릴리스 자산을 마지막에 만든다. 그러니 설치 검증은 아직 없는 이번 버전이 아니라
      # "이미 공개된 최신 릴리스"를 내려받아야 한다(없으면 package.json 버전으로 폴백).
      - name: Resolve the released version for download checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo wnduddld0513/dsh-purge-kr --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$tag" ]; then
            echo "PURGE_RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"
          else
            echo "::warning::공개된 릴리스가 없습니다 — package.json 버전으로 내려받기 검증을 시도합니다."
          fi
      - name: Full test suite
        if: runner.os != 'Windows'
        run: npm test
      - name: Full Windows suite with bounded process concurrency
        if: runner.os == 'Windows'
        run: npm test -- --test-concurrency=2
      - name: Windows PowerShell 5.1 installer wrapper
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/install-windows.ps1
      - name: PowerShell 7 installer wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/install-windows.ps1
      - name: Real Windows Electron handoff lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path ([IO.Path]::GetTempPath()) 'purge-electron'
          npm install --prefix $runtime --no-package-lock --no-audit --no-fund electron@44.7.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $runtime 'node_modules/electron/install.js')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PURGE_ELECTRON_EXEC = Join-Path $runtime 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path -LiteralPath $env:PURGE_ELECTRON_EXEC)) { throw 'Electron binary was not installed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-windows-job-handoff.ps1 -ElectronExe $env:PURGE_ELECTRON_EXEC -SourceRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/windows-electron-handoff.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-update-runtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $downloadLog = Join-Path $env:RUNNER_TEMP 'purge-download.log'
          $downloadError = Join-Path $env:RUNNER_TEMP 'purge-download-error.log'
          $p = Start-Process -FilePath $env:PURGE_ELECTRON_EXEC -ArgumentList 'scripts/check-bootstrap-download-runtime.mjs' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $downloadLog -RedirectStandardError $downloadError
          Get-Content $downloadLog,$downloadError
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Real macOS Electron diagnostics and manual-quit handoff
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/purge-electron"
          npm install --prefix "$runtime" --no-package-lock --no-audit --no-fund electron@44.7.0
          node "$runtime/node_modules/electron/install.js"
          export PURGE_ELECTRON_EXEC="$runtime/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          npm run test:electron
          node scripts/check-update-runtime.mjs
          ELECTRON_RUN_AS_NODE=1 "$PURGE_ELECTRON_EXEC" scripts/check-bootstrap-download-runtime.mjs
      - name: Real Linux root and service-user audit ownership
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/check-audit-ownership.mjs
      - name: Verify packed artifact on each platform
        run: npm pack --ignore-scripts && node scripts/smoke.mjs
